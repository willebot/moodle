# Vendored third-party libraries of Moodle 4.1.22.
#
# WHY THIS FILE EXISTS
# Moodle does not use Composer or npm for its runtime dependencies. It vendors
# third-party libraries directly into its source tree, so ORT's analyzer sees
# them as plain files or as projects -- never as packages. The advisor only
# queries packages, so none of this code was reachable for vulnerability
# monitoring. This document declares each vendored library as an SPDX package
# carrying a PURL, which ORT's SpdxDocumentFile analyzer turns into a real ORT
# package that the advisor can then look up.
#
# REQUIRED ANALYZER OPTION
# PURLs are only honoured when the analyzer runs with:
#   packageManagerOptions.SpdxDocumentFile.options.deduceOrtIdFromPurl: "true"
# Without it ORT derives identifiers from the SPDX IDs instead and advisory
# matching will not work.
#
# SOURCE AND SCOPE
# Generated from the 21 thirdpartylibs.xml manifests at tag v4.1.22
# (commit df1157bb845eabedd31989d6a1a6e18f638ff890). 96 declared entries
# collapse to 79 distinct libraries after de-duplication -- Bootstrap alone is
# declared 16 times, Font Awesome, ogv.js and Video.js twice each.
#
# CAVEATS -- READ BEFORE TRUSTING ADVISORY RESULTS
#  1. Entries whose comment says NEEDS-REVIEW carry no PURL. They are
#     inventoried but NOT monitored. Do not read their absence from advisory
#     results as "no known vulnerabilities".
#  2. A PURL asserts that the vendored code corresponds to that upstream
#     release. Moodle patches vendored libraries. Where it has, advisory hits
#     describe the upstream release, not necessarily the code in this tree.
#  3. Versions are taken verbatim from thirdpartylibs.xml and are not
#     independently verified against the vendored source.
#  4. axe-core is vendored at lib/behat/axe, which the .ort.yml path excludes
#     cover. SPDX-declared packages are not path-bound, so it will still be
#     reported here. That inconsistency is intentional for now -- flag it if
#     the first analyzer run confirms the package appears.
#
