    - id: "(GHSA-xh5m-36r6-47m3|CVE-2026-59933)"
      reason: "INEFFECTIVE_VULNERABILITY"
      comment: >-
        XLS/OLE sector-chain self-loop causing memory exhaustion.

        The advisory states the issue is reachable from Reader\\Xls::canRead() and
        therefore from automatic spreadsheet type detection. Moodle vendors neither
        the XLS reader nor the OLE support it depends on. lib/phpspreadsheet/readme_moodle.txt
        documents both removals: Shared/OLE.php, Shared/OLERead.php and Shared/OLE/*
        are removed because OLE is not DFSG compliant and unused by core, and
        Reader/Xls.php, Reader/Xls/*, Shared/Xls.php, Writer/Xls.php and Writer/Xls/*
        are removed as Excel 5 format support unused by core. Verified: all eight
        paths are absent from the vendored tree.

    - id: "(GHSA-6hq5-7373-42rg|CVE-2026-59931)"
      reason: "INEFFECTIVE_VULNERABILITY"
      comment: >-
        SSRF bypass via HTTP redirect in the WEBSERVICE() calculation function.

        Reaching the WEBSERVICE() calculation function requires a formula to be
        evaluated. Moodle core never writes formula cells: MoodleExcelWorksheet
        exposes write_formula() in lib/excellib.class.php, but no core code calls
        it — the only write_formula occurrences elsewhere belong to
        lib/odslib.class.php, which is Moodle's separate ODS writer and not backed
        by PhpSpreadsheet.

        CAVEAT: write_formula() is a public API. A third-party plugin that passes a
        user-controlled formula string through it could reach the calculation
        engine, since the Xlsx writer pre-calculates formulas by default. This
        resolution covers Moodle core only; re-assess if a plugin in scope writes
        formulas from untrusted input.

    - id: "(GHSA-3fgr-xjr6-xqm8)"
      reason: "INEFFECTIVE_VULNERABILITY"
      comment: >-
        Code injection in Wrapper::buildClientWrapperCode via manipulation of the $client argument.

        The vulnerable function, Wrapper::buildClientWrapperCode, is a code-generation
        helper that Moodle never calls. Verified across the 4.1.22 tree: core
        references phpxmlrpc only by registering the PhpXmlRpc namespace in
        lib/classes/component.php, and MNet uses the Client and Server classes
        rather than the Wrapper's code generation. No call to
        buildClientWrapperCode exists outside the vendored library.

        Note separately that MNet is disabled by default
        ($CFG->mnet_dispatcher_mode defaults to 'off'), so even the Client and
        Server paths are inactive unless an administrator enables MNet.

    - id: "(GHSA-65rp-mhqf-8gj3|CVE-2023-26102)"
      reason: "CANT_FIX_VULNERABILITY"
      comment: >-
        Prototype pollution in rangy's extend() function in rangy-core.js, which
        uses a recursive merge that can modify properties of Object.prototype.

        This is NOT a false positive. rangy 1.3.0 is vendored at
        lib/editor/atto/yui/src/rangy and is used by the Atto editor, which ships
        enabled in Moodle 4.1. The finding is accepted rather than dismissed.

        No remediation exists: rangy has published no release since 1.3.0 and the
        advisory lists no fixed version, so there is nothing to upgrade to. The
        only real mitigations are a Moodle upgrade to a branch that has moved off
        Atto, or removal of the Atto editor. Both are platform decisions outside
        the scope of this repository.
