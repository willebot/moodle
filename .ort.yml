    - id: "(GHSA-jmpx-686v-c3wx|CVE-2024-56365)"
      reason: "INEFFECTIVE_VULNERABILITY"
      comment: >-
        Reflected XSS in the constructor of the Downloader class, exploitable via samples/download.php.

        The vulnerable script lives in PhpSpreadsheet's samples/ directory, which
        Moodle does not vendor. lib/phpspreadsheet/readme_moodle.txt documents the
        import procedure and explicitly instructs the maintainer to remove
        vendor/phpoffice/phpspreadsheet/samples (along with bin/ and docs/).
        Verified: no samples/ directory exists anywhere under lib/phpspreadsheet,
        and the Downloader helper class referenced by one of these advisories is
        not present in the tree either. The attack surface is absent from the
        distribution.

