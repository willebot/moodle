# ORT repository configuration for the Moodle 4.1.22 compliance analysis.
#
# This branch (ort/4.1.22) is tag v4.1.22 plus this file, and nothing else.
# It exists only because .ort.yml cannot be committed to a tag. The analysed
# tree is otherwise byte-identical to the Moodle 4.1.22 release, commit
# df1157bb845eabedd31989d6a1a6e18f638ff890.
#
# Target rationale: mediamaisteri/moodle-block_mmquicklink declares
# "moodle/moodle": "~4.1.0", which resolves to v4.1.22 — the final 4.1
# release, 4.1 LTS security support having ended 2025-12-08. Analysing this
# exact revision keeps this standalone Moodle analysis aligned with the
# plugin's SBOM reference, pkg:composer/moodle/moodle@v4.1.22.
#
# No curations.licenseFindings are defined yet, deliberately. Those should be
# added reactively to correct actual scanner misdetections, not written
# speculatively before any scan results exist.

excludes:
  paths:
    - pattern: "**/tests/**"
      reason: "TEST_OF"
      comment: >-
        Unit test code and test-only support files, distributed throughout the
        Moodle tree (approximately 3,678 files at this revision). Not part of
        the functional surface of a deployed Moodle for compliance purposes.

    - pattern: "**/behat/**"
      reason: "TEST_OF"
      comment: >-
        Behat acceptance-test infrastructure (approximately 1,464 files at this
        revision). CAVEAT: this also excludes lib/behat/axe, which vendors
        axe-core 4.5.1 under MPL-2.0 as declared in lib/thirdpartylibs.xml. If
        the vendored third-party inventory is required to cover test tooling as
        well, narrow or remove this entry.

    - pattern: "**/fixtures/**"
      reason: "TEST_OF"
      comment: >-
        Test fixture data (approximately 518 files at this revision). Fixtures
        frequently embed sample licence texts and headers, which the scanner
        reports as findings against files that are not shipped code.

    - pattern: "package.json"
      reason: "BUILD_TOOL_OF"
      comment: >-
        Moodle's root npm manifest. It declares zero runtime "dependencies" and
        39 "devDependencies" — Grunt, ESLint, Stylelint and related build and
        lint tooling. None of it is distributed with Moodle; the JavaScript that
        ships is committed to the tree as AMD modules and built artifacts.
        Excluding the manifest stops ORT treating it as a project and running
        `npm ci` against it, which currently fails and produces ~50 ERROR issues.
        The excluded manifest does not remove any JavaScript source from the
        scan — those files belong to the root Moodle project.

    - pattern: "**/vendor/**/composer.json"
      reason: "OTHER"
      comment: >-
        Composer manifests belonging to vendored third-party libraries whose
        code is committed to the Moodle tree (9 manifests under auth/cas and
        lib/phpspreadsheet). Moodle never runs Composer against these; the
        libraries ship as committed source. Resolving them network-fetches
        dependency metadata that does not reflect what Moodle actually
        distributes — for example phpoffice/phpspreadsheet requires
        dompdf/dompdf, which Moodle deliberately does not vendor, so resolution
        would introduce a package that is not present in the tree at all.
        Excluding only the manifest files leaves the vendored source itself in
        the root Moodle project, so it is still scanned for licences.

  scopes:
    - pattern: "require-dev"
      reason: "DEV_DEPENDENCY_OF"
      comment: >-
        Composer development dependencies — PHPUnit, Behat, Mink,
        symfony/process, vfsstream and their transitive dependencies. Moodle
        commits composer.lock, so these resolve into a complete package tree,
        but none of them are distributed as part of Moodle itself.

# ---------------------------------------------------------------------------
# Vulnerability resolutions from triage of ORT run 1756.
#
# Run 1756 reported 111 findings (4 CRITICAL, 44 HIGH, 62 MEDIUM) against the
# 79 vendored libraries declared in moodle-vendored-libraries.spdx.yml. The
# entries below cover the CRITICAL and HIGH findings that were assessed as not
# reachable in Moodle 4.1.22, each verified against the vendored source tree at
# commit df1157bb845eabedd31989d6a1a6e18f638ff890.
#
# NOT resolved here, and deliberately so:
#   - TinyMCE CVE-2026-47759 / -47761 / -47762 (stored XSS): reachable.
#   - TCPDF CVE-2024-56521 / -56522: reachability undetermined.
#   - rangy CVE-2023-26102: real, but no upstream fix exists.
# ---------------------------------------------------------------------------

resolutions:
  vulnerabilities:
    - id: "(GHSA-q4q6-r8wh-5cgh|CVE-2026-34084)"
      reason: "INEFFECTIVE_VULNERABILITY"
      comment: >-
        SSRF/RCE in IOFactory::load when $filename is user controlled, via php stream wrappers (ftp://, phar://, ssh2.sftp://) satisfying is_file().

        Moodle core never invokes any PhpSpreadsheet Reader. Its sole consumer of
        the library is lib/excellib.class.php, which uses IOFactory::createWriter
        (line 142) to WRITE spreadsheet exports. Verified across the whole 4.1.22
        tree: every reference to PhpOffice\\PhpSpreadsheet\\Reader occurs inside the
        vendored library itself, and there is no call to IOFactory::load,
        IOFactory::createReader or IOFactory::identify anywhere in Moodle core.
        This finding requires a reader entry point, so the vulnerable code path is
        never reached.

